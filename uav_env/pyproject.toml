[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-uav-env"
version = "0.1.0"
description = "Multi-UAV Fleet Tracking environment for OpenEnv — Meta x PyTorch Hackathon"
requires-python = ">=3.10"

# FIX: removed [core] extra — that extra does not exist in openenv-core
# and causes pip install warnings / failures inside Docker.
dependencies = [
    "openenv-core>=0.2.2",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "imageio>=2.31.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

# FIX: removed broken script entry "uav_env.server.app:main"
# (no main() existed in server/app.py — that reference crashed on invocation).
# The server is started directly by the Dockerfile CMD via uvicorn.

[tool.setuptools]
include-package-data = true
packages = ["uav_env", "uav_env.server"]
package-dir = { "uav_env" = ".", "uav_env.server" = "server" }