spec_version: 1
name: uav_env_v3_multi
version: "0.1.0"
author: "FullmetalDevs"
description: "Multi-UAV 3D fleet pursuit with evasive targets, stochastic OU wind, and hard NFZ enforcement. Built with OpenEnv for the Meta x PyTorch Hackathon."
type: space
runtime: fastapi
app: server.app:app
port: 8000
multi_task: true 
tasks:
  - id: easy
    description: "3 UAVs, static targets, no wind, no NFZ"
    difficulty: easy
  - id: medium
    description: "3 UAVs, random-walk targets, light wind (1.5 m/s), no NFZ"
    difficulty: medium
  - id: hard
    description: "3 UAVs, evasive targets, full OU wind (3 m/s), NFZ active"
    difficulty: hard